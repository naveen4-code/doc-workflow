<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="layout">
  <div class="sidebar">
    <h2>DocFlow</h2>
    <a>Upload</a>
    <a>My Documents</a>
  </div>
  <div class="main">
    <div class="topbar">
      <h3>User Dashboard</h3>
    </div>
    <div class="card">
      <h3>Upload Document</h3>
      <input id="title" placeholder="Title">
      <input type="file" id="file">
      <select id="sector"></select>
      <select id="type"></select>
      <button onclick="upload()">Upload</button>
    </div>
    <div class="card">
      <h3>My Documents</h3>
      <table>
        <thead>
          <tr>
            <th>Title</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="docs"></tbody>
      </table>
    </div>
  </div>
</div>
<script src="js/user.js"></script>
</body>
</html>
